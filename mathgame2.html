<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quest Adventure!</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --background: #F7FFF7;
            --dark: #2F3E46;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: var(--background);
            color: var(--dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background: white;
            border: 8px solid var(--secondary);
            border-radius: 30px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 0px rgba(0,0,0,0.1);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            background: #eefcf9;
            padding: 10px 20px;
            border-radius: 15px;
        }

        .stat-box {
            color: #2b7a78;
        }

        .equation {
            font-size: 3.5rem;
            margin: 20px 0;
            font-weight: bold;
            color: var(--dark);
            letter-spacing: 2px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-option {
            background-color: white;
            border: 4px solid var(--dark);
            border-radius: 20px;
            padding: 15px;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 6px 0 var(--dark);
        }

        .btn-option:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        .btn-option:hover {
            background-color: #f0f0f0;
        }

        /* Feedback Effects */
        .correct {
            background-color: #A8E6CF !important;
            animation: bounce 0.5s;
        }

        .wrong {
            background-color: #FF8B94 !important;
            animation: shake 0.5s;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .level-up-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: var(--primary);
            color: white;
            padding: 30px 50px;
            border-radius: 20px;
            font-size: 2.5rem;
            font-weight: bold;
            border: 5px solid white;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease-out;
            pointer-events: none;
            z-index: 10;
        }

        .level-up-popup.show {
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="stats-bar">
            <div class="stat-box">⭐ Score: <span id="score">0</span></div>
            <div class="stat-box">🚀 Level: <span id="level">1</span></div>
        </div>

        <div class="equation" id="equation">2 + 3</div>

        <div class="options-grid" id="options-container">
            </div>
    </div>

    <div class="level-up-popup" id="level-popup">LEVEL UP! 🎉</div>

    <script>
        // Game State
        let score = 0;
        let level = 1;
        let currentAnswer = 0;
        
        // DOM Elements
        const equationEl = document.getElementById('equation');
        const optionsContainer = document.getElementById('options-container');
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const levelPopup = document.getElementById('level-popup');

        // Generate a random number based on limits
        const getRandomNum = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

        // Shuffle helper for multiple choice buttons
        const shuffleArray = (array) => array.sort(() => Math.random() - 0.5);

        function generateQuestion() {
            let num1, num2, operation;
            
            // Level Progression Logic (Adapts to 7-10 year olds)
            if (level === 1) {
                // Easy Addition (Age 7)
                num1 = getRandomNum(1, 10);
                num2 = getRandomNum(1, 10);
                operation = '+';
                currentAnswer = num1 + num2;
            } else if (level === 2) {
                // Easy Subtraction
                num1 = getRandomNum(10, 20);
                num2 = getRandomNum(1, 10);
                operation = '-';
                currentAnswer = num1 - num2;
            } else if (level === 3) {
                // Medium Addition & Subtraction (Age 8-9)
                num1 = getRandomNum(10, 50);
                num2 = getRandomNum(1, 20);
                operation = Math.random() > 0.5 ? '+' : '-';
                currentAnswer = operation === '+' ? num1 + num2 : num1 - num2;
            } else {
                // Introduction to Multiplication (Age 9-10)
                num1 = getRandomNum(2, 9);
                num2 = getRandomNum(1, 10);
                operation = '×';
                currentAnswer = num1 * num2;
            }

            // Display the math problem
            equationEl.innerText = `${num1} ${operation} ${num2}`;
            generateOptions();
        }

        function generateOptions() {
            optionsContainer.innerHTML = '';
            
            // Create wrong answers that look realistic
            let wrongAnswers = new Set();
            while(wrongAnswers.size < 3) {
                let offset = getRandomNum(-5, 5);
                let fakeAns = currentAnswer + offset;
                if(fakeAns !== currentAnswer && fakeAns >= 0) {
                    wrongAnswers.add(fakeAns);
                }
            }

            // Combine correct and wrong answers, then mix them up
            let allChoices = [currentAnswer, ...wrongAnswers];
            shuffleArray(allChoices);

            // Create the buttons
            allChoices.forEach(choice => {
                const button = document.createElement('button');
                button.classList.add('btn-option');
                button.innerText = choice;
                button.onclick = () => checkAnswer(choice, button);
                optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(selected, selectedButton) {
            // Disable all buttons temporarily to prevent double clicking
            const buttons = document.querySelectorAll('.btn-option');
            buttons.forEach(btn => btn.style.pointerEvents = 'none');

            if (selected === currentAnswer) {
                selectedButton.classList.add('correct');
                score += 10;
                scoreEl.innerText = score;
                
                // Check for Level Up every 50 points
                if (score > 0 && score % 50 === 0) {
                    levelUp();
                }
            } else {
                selectedButton.classList.add('wrong');
                // Optional: Reduce score a bit for a wrong answer
                score = Math.max(0, score - 5);
                scoreEl.innerText = score;
            }

            // Load next question after a brief delay so they see the color feedback
            setTimeout(() => {
                generateQuestion();
            }, 800);
        }

        function levelUp() {
            level++;
            levelEl.innerText = level;
            
            // Show "Level Up" animation popup
            levelPopup.classList.add('show');
            setTimeout(() => {
                levelPopup.classList.remove('show');
            }, 1200);
        }

        // Start the game loop
        generateQuestion();
    </script>
</body>
</html>
