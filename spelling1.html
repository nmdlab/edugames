<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spell Quest: Kids Spelling Adventure</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Fredoka One', 'Nunito', 'Segoe UI', sans-serif;
            color: #2c3e50;
        }

        /* Whimsical Cartoon Moving Background */
        #background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #a1c4fd 0%, #c2e9fb 100%);
            z-index: -3;
        }

        /* Interactive Canvas for moving elements (floating clouds, bubbles, stars) */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: -2;
            pointer-events: none;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            position: relative;
        }

        /* Top HUD Bar */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.9);
            border: 4px solid #fff;
            border-radius: 25px;
            padding: 10px 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            z-index: 10;
        }

        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hud-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7f8c8d;
            font-weight: bold;
        }

        .hud-value {
            font-size: 1.6rem;
            font-weight: 900;
            color: #ff6b6b;
            text-shadow: 1px 1px 0px #fff;
        }

        /* Main Game Board Card */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border: 6px solid #fff;
            border-radius: 30px;
            padding: 30px;
            width: 100%;
            max-width: 650px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            position: relative;
            z-index: 5;
            transition: transform 0.2s ease;
        }

        /* Target Picture Showcase */
        .picture-box {
            width: 170px;
            height: 170px;
            background: radial-gradient(circle, #ffe66d 0%, #ffc300 100%);
            border: 5px solid #fff;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6.5rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            animation: floaty 3s ease-in-out infinite;
        }

        @keyframes floaty {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }

        /* Answer Letter Slots */
        .slots-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .letter-slot {
            width: 55px;
            height: 60px;
            background: #f1f2f6;
            border: 3px dashed #bdc3c7;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 900;
            color: #2c3e50;
            text-transform: uppercase;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.05);
            transition: all 0.2s;
            cursor: pointer;
        }

        .letter-slot.filled {
            background: #fff;
            border: 3px solid #ff6b6b;
            color: #ff6b6b;
            box-shadow: 0 6px 0px #ee5253, 0 8px 15px rgba(0,0,0,0.1);
            transform: translateY(-4px);
        }

        /* Scrambled Tile Choices */
        .tiles-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
            min-height: 75px;
            align-items: center;
        }

        .letter-tile {
            width: 55px;
            height: 60px;
            background: #ffe66d;
            border: 3px solid #ffcc00;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 900;
            color: #4b4b4b;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 0px #d3a000, 0 8px 15px rgba(0,0,0,0.1);
            transition: all 0.15s;
        }

        .letter-tile:hover {
            transform: translateY(-2px);
            background: #fff1a8;
        }

        .letter-tile:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #d3a000;
        }

        .letter-tile.used {
            opacity: 0.2;
            pointer-events: none;
            transform: scale(0.9);
        }

        /* Screen States */
        .screen {
            display: none;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        /* Fun Buttons */
        .btn {
            background: linear-gradient(135deg, #10ac84, #1dd1a1);
            border: 4px solid #fff;
            color: white;
            padding: 15px 40px;
            font-size: 1.6rem;
            font-weight: 900;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: all 0.2s;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.15);
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 25px rgba(0,0,0,0.2);
        }

        .btn:active {
            transform: translateY(2px);
        }

        .btn-yellow {
            background: linear-gradient(135deg, #ff9f43, #ffb8b8);
        }

        .title {
            font-size: 4rem;
            font-weight: 900;
            margin: 0 0 10px 0;
            color: #ff6b6b;
            text-shadow: 4px 4px 0px #fff, 6px 6px 15px rgba(0,0,0,0.15);
            text-align: center;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #57606f;
            margin-bottom: 40px;
            font-weight: bold;
            background: rgba(255,255,255,0.7);
            padding: 8px 20px;
            border-radius: 20px;
        }

        /* Sparkly Win Animations */
        .pop-animation {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop {
            0% { transform: scale(0.5); }
            100% { transform: scale(1); }
        }

        .success-banner {
            font-size: 2rem;
            font-weight: 900;
            color: #10ac84;
            margin-top: 15px;
            height: 40px;
        }

        /* Action Buttons Row */
        .actions-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .action-btn {
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 15px;
            background: #54a0ff;
            border: 3px solid #fff;
            color: white;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            background: #2e86de;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="background"></div>
    <canvas id="bubbleCanvas"></canvas>

    <div class="game-container">

        <!-- START SCREEN -->
        <div id="start-screen" class="screen active">
            <h1 class="title">SPELL QUEST</h1>
            <p class="subtitle">🎈 Pop the Letters & Spell the Picture! (Ages 7-10) 🎈</p>
            <button class="btn" onclick="startGame()">LET'S PLAY!</button>
        </div>

        <!-- GAMEPLAY SCREEN -->
        <div id="play-screen" class="screen">
            <div class="hud">
                <div class="hud-item">
                    <span class="hud-label">Stars</span>
                    <span id="score-display" class="hud-value">0 ⭐</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">Level</span>
                    <span id="level-display" class="hud-value">1</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">Progress</span>
                    <span id="progress-display" class="hud-value">1/5</span>
                </div>
            </div>

            <div class="card" id="game-card">
                <div class="picture-box" id="picture-emoji">🐱</div>
                
                <div class="slots-container" id="slots-container">
                    <!-- Target letter slots generated dynamically -->
                </div>

                <div class="tiles-container" id="tiles-container">
                    <!-- Shuffled letter options generated dynamically -->
                </div>

                <div class="success-banner" id="feedback-banner"></div>

                <div class="actions-row">
                    <button class="action-btn" onclick="clearSpell()">Reset 🔄</button>
                    <button class="action-btn" style="background: #feca57" onclick="giveHint()">Hint 💡</button>
                </div>
            </div>
        </div>

        <!-- OUTRO / COMPLETED SCREEN -->
        <div id="win-screen" class="screen">
            <h1 class="title">YOU'RE A SUPERSTAR!</h1>
            <p class="subtitle" id="final-score-text">You got 50 Stars and mastered Level 1!</p>
            <button class="btn btn-yellow" onclick="startGame()">PLAY AGAIN 🔄</button>
        </div>

    </div>

    <script>
        // --- Web Audio Synthesizer (Kid-Friendly Sounds) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'correct') {
                // Happy double-tone chime
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(110, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'hint') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'levelup') {
                // Magical fan-fare
                const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'sine';
                    o.frequency.setValueAtTime(freq, audioCtx.currentTime + (index * 0.08));
                    g.gain.setValueAtTime(0.15, audioCtx.currentTime + (index * 0.08));
                    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (index * 0.08) + 0.2);
                    o.start(audioCtx.currentTime + (index * 0.08));
                    o.stop(audioCtx.currentTime + (index * 0.08) + 0.25);
                });
            }
        }

        // --- Words DB with Visual Emojis ---
        const levelWords = {
            1: [
                { word: 'CAT', emoji: '🐱' },
                { word: 'DOG', emoji: '🐶' },
                { word: 'SUN', emoji: '☀️' },
                { word: 'FROG', emoji: '🐸' },
                { word: 'FISH', emoji: '🐟' }
            ],
            2: [
                { word: 'BIRD', emoji: '🐦' },
                { word: 'CAKE', emoji: '🍰' },
                { word: 'TREE', emoji: '🌳' },
                { word: 'BOAT', emoji: '⛵' },
                { word: 'STAR', emoji: '⭐' }
            ],
            3: [
                { word: 'APPLE', emoji: '🍎' },
                { word: 'HOUSE', emoji: '🏠' },
                { word: 'TRAIN', emoji: '🚂' },
                { word: 'CLOCK', emoji: '⏰' },
                { word: 'SHARK', emoji: '🦈' }
            ]
        };

        // --- Game State Variables ---
        let score = 0;
        let currentLevel = 1;
        let currentWordIndex = 0;
        let currentWord = {};
        let userSpelling = [];
        let tileLetterMapping = []; // Tracks original indexes

        // --- Animated Background Canvas (Cute drifting bubbles & clouds) ---
        const canvas = document.getElementById('bubbleCanvas');
        const ctx = canvas.getContext('2d');
        let elements = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Bubble {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height;
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 50;
                this.radius = Math.random() * 25 + 10;
                this.speedY = Math.random() * -0.8 - 0.4;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.color = `hsla(${Math.random() * 360}, 90%, 80%, 0.4)`;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.y < -50) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                // Shimmer highlight inside bubble
                ctx.beginPath();
                ctx.arc(this.x - this.radius/3, this.y - this.radius/3, this.radius/4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fill();
            }
        }

        function initBackground() {
            elements = [];
            for (let i = 0; i < 30; i++) {
                elements.push(new Bubble());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            elements.forEach(el => {
                el.update();
                el.draw();
            });
            requestAnimationFrame(animate);
        }
        initBackground();
        animate();

        // --- Gameplay Controller ---
        function startGame() {
            score = 0;
            currentLevel = 1;
            currentWordIndex = 0;
            showScreen('play-screen');
            loadWord();
        }

        function loadWord() {
            const list = levelWords[currentLevel];
            currentWord = list[currentWordIndex];
            userSpelling = Array(currentWord.word.length).fill(null);
            
            document.getElementById('picture-emoji').innerText = currentWord.emoji;
            document.getElementById('picture-emoji').classList.add('pop-animation');
            setTimeout(() => {
                document.getElementById('picture-emoji').classList.remove('pop-animation');
            }, 500);

            document.getElementById('feedback-banner').innerText = "";
            updateHUD();
            buildSlots();
            buildTiles();
        }

        function buildSlots() {
            const container = document.getElementById('slots-container');
            container.innerHTML = "";
            userSpelling.forEach((letter, index) => {
                const slot = document.createElement('div');
                slot.className = 'letter-slot';
                slot.id = `slot-${index}`;
                slot.onclick = () => removeLetterFromSlot(index);
                container.appendChild(slot);
            });
        }

        function buildTiles() {
            const container = document.getElementById('tiles-container');
            container.innerHTML = "";

            // Create spelling pool: standard word letters + 2 random letters for challenge
            let lettersArray = currentWord.word.split('');
            const extraAlphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            while (lettersArray.length < currentWord.word.length + 2) {
                let randomChar = extraAlphabet[Math.floor(Math.random() * 26)];
                if (!lettersArray.includes(randomChar)) {
                    lettersArray.push(randomChar);
                }
            }

            // Shuffle array
            lettersArray.sort(() => Math.random() - 0.5);

            tileLetterMapping = lettersArray;

            lettersArray.forEach((letter, index) => {
                const tile = document.createElement('div');
                tile.className = 'letter-tile';
                tile.innerText = letter;
                tile.id = `tile-${index}`;
                tile.onclick = () => selectTile(letter, index);
                container.appendChild(tile);
            });
        }

        function selectTile(letter, tileIndex) {
            // Find first empty slot
            const emptyIdx = userSpelling.findIndex(v => v === null);
            if (emptyIdx === -1) return; // All slots full

            playSound('click');

            userSpelling[emptyIdx] = { letter, tileIndex };
            
            // Mark tile as used
            document.getElementById(`tile-${tileIndex}`).classList.add('used');

            // Fill Slot
            const slot = document.getElementById(`slot-${emptyIdx}`);
            slot.innerText = letter;
            slot.classList.add('filled');

            checkSpelling();
        }

        function removeLetterFromSlot(slotIndex) {
            const data = userSpelling[slotIndex];
            if (!data) return;

            playSound('click');

            // Remove used state from the source tile
            document.getElementById(`tile-${data.tileIndex}`).classList.remove('used');

            // Empty slot
            userSpelling[slotIndex] = null;
            const slot = document.getElementById(`slot-${slotIndex}`);
            slot.innerText = "";
            slot.classList.remove('filled');
        }

        function clearSpell() {
            playSound('click');
            userSpelling.forEach((_, idx) => removeLetterFromSlot(idx));
        }

        function giveHint() {
            // Find first empty or incorrect slot and fill it with the correct letter
            const correctWordLetters = currentWord.word.split('');
            let targetIdx = -1;

            for (let i = 0; i < correctWordLetters.length; i++) {
                if (!userSpelling[i] || userSpelling[i].letter !== correctWordLetters[i]) {
                    targetIdx = i;
                    break;
                }
            }

            if (targetIdx === -1) return; // Already spelt right or fully filled correctly

            // If slot is filled with incorrect letter, remove it first
            if (userSpelling[targetIdx]) {
                removeLetterFromSlot(targetIdx);
            }

            // Find matching unused tile with the correct letter
            const neededLetter = correctWordLetters[targetIdx];
            let foundTileIdx = -1;
            for (let i = 0; i < tileLetterMapping.length; i++) {
                if (tileLetterMapping[i] === neededLetter) {
                    const tileEl = document.getElementById(`tile-${i}`);
                    if (!tileEl.classList.contains('used')) {
                        foundTileIdx = i;
                        break;
                    }
                }
            }

            if (foundTileIdx !== -1) {
                playSound('hint');
                selectTile(neededLetter, foundTileIdx);
            }
        }

        function checkSpelling() {
            // Check if all slots are filled
            const anyEmpty = userSpelling.some(v => v === null);
            if (anyEmpty) return;

            const spellingStr = userSpelling.map(v => v.letter).join('');
            const card = document.getElementById('game-card');

            if (spellingStr === currentWord.word) {
                playSound('correct');
                score += 10;
                document.getElementById('feedback-banner').innerText = "⭐ AWESOME! ⭐";
                document.getElementById('feedback-banner').style.color = "#10ac84";
                
                // Pop animation on elements
                card.classList.add('pop-animation');
                setTimeout(() => card.classList.remove('pop-animation'), 400);

                setTimeout(advanceWord, 1500);
            } else {
                playSound('wrong');
                document.getElementById('feedback-banner').innerText = "Try again! 🤔";
                document.getElementById('feedback-banner').style.color = "#ff6b6b";
            }
        }

        function advanceWord() {
            currentWordIndex++;
            const list = levelWords[currentLevel];
            
            if (currentWordIndex >= list.length) {
                // Next Level
                currentWordIndex = 0;
                currentLevel++;
                
                if (levelWords[currentLevel]) {
                    playSound('levelup');
                    alert(`🌟 Level Completed! Welcome to Level ${currentLevel}! 🌟`);
                    loadWord();
                } else {
                    // Game Over / Game Won completely!
                    playSound('levelup');
                    document.getElementById('final-score-text').innerText = `You earned ${score} Stars and completed all levels! You're a spelling champion!`;
                    showScreen('win-screen');
                }
            } else {
                loadWord();
            }
        }

        function updateHUD() {
            document.getElementById('score-display').innerText = `${score} ⭐`;
            document.getElementById('level-display').innerText = currentLevel;
            document.getElementById('progress-display').innerText = `${currentWordIndex + 1}/${levelWords[currentLevel].length}`;
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }
    </script>
</body>
</html>
