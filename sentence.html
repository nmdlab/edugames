<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>English Word Challenge</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f9ff; text-align: center; padding: 50px; }
        .game-container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); display: inline-block; }
        .sentence { font-size: 1.5rem; margin: 20px 0; }
        .options { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        button { padding: 15px 25px; font-size: 1rem; cursor: pointer; border: none; border-radius: 10px; background: #6c5ce7; color: white; transition: 0.3s; }
        button:hover { background: #a29bfe; }
        #score { font-size: 1.2rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="game-container">
    <h2>English Word Challenge</h2>
    <p id="score">Score: 0</p>
    <div class="sentence" id="sentence">The cat is ___ on the mat.</div>
    
    <div class="options">
        <button onclick="checkAnswer('running')">running</button>
        <button onclick="checkAnswer('sitting')">sitting</button>
        <button onclick="checkAnswer('eating')">eating</button>
    </div>
</div>

<script>
    let score = 0;
    const correctAns = "sitting";

    function playSound(isCorrect) {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        osc.connect(audioCtx.destination);
        osc.frequency.value = isCorrect ? 600 : 200;
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }

    function checkAnswer(choice) {
        if (choice === correctAns) {
            score += 10;
            document.getElementById('score').innerText = "Score: " + score;
            alert("Correct! Well done!");
            playSound(true);
        } else {
            alert("Oops! Try again.");
            playSound(false);
        }
    }
</script>

</body>
</html>
